name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport
        working-directory: backend

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-backend
          fail_ci_if_error: false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nangjanggo-backend ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag nangjanggo-backend ${{ secrets.DOCKER_USERNAME }}/nangjanggo-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nangjanggo-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Nangjanggo
            git pull origin main
            cd backend
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} docker compose pull app
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} docker compose up -d --no-build --force-recreate app
