name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nangjanggo-backend ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag nangjanggo-backend ${{ secrets.DOCKER_USERNAME }}/nangjanggo-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nangjanggo-backend:latest
